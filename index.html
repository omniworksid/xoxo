<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face XOXO</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    
    .container { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; margin-bottom: 5px; font-size: 28px; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

    /* Camera Section */
    .camera-box { position: relative; width: 200px; height: 200px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; background: #000; border: 4px solid var(--accent); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .camera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); pointer-events: none; }
    canvas { display: none; }
    
    input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; font-size: 15px; }
    input, select { background: #334155; color: #fff; outline: none; }
    button { background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { filter: brightness(1.1); }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-ready { background: var(--success); }

    /* Lobby Section */
    .player-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; justify-content: center; }
    .player-item { display: flex; flex-direction: column; align-items: center; background: #334155; padding: 10px; border-radius: 8px; min-width: 80px; }
    .player-item img { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 5px; border: 2px solid #fff; }
    .status-tag { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #ef4444; margin-top: 5px; }
    .status-tag.ready { background: var(--success); }

    /* Game Section */
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
    .timer { background: #ef4444; padding: 4px 12px; border-radius: 20px; }
    .board { display: grid; gap: 4px; background: #334155; padding: 4px; border-radius: 8px; aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
    .cell { background: var(--card); border-radius: 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; }
    .cell img { width: 85%; height: 85%; border-radius: 50%; object-fit: cover; animation: popIn 0.2s ease-out; }
    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>Face XOXO</h1>
  <p class="subtitle" id="sysMsg">Jadikan wajahmu sebagai bidak catur!</p>

  <!-- LAYAR LOGIN & KAMERA -->
  <div id="setupScreen">
    <div class="camera-box">
      <video id="video" autoplay playsinline></video>
      <div class="camera-overlay"></div>
    </div>
    <input type="text" id="nameInput" placeholder="Masukkan Nama Kamu..." maxlength="10">
    <button id="joinBtn">Jepret & Masuk Lobby</button>
    <canvas id="canvas" width="200" height="200"></canvas>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" class="hidden">
    <div id="hostSettings" class="hidden">
      <label style="font-size: 12px; color: #94a3b8;">Waktu per Giliran (Khusus Host):</label>
      <select id="timerSelect">
        <option value="5">Super Cepat (5 Detik)</option>
        <option value="10" selected>Normal (10 Detik)</option>
        <option value="30">Santai (30 Detik)</option>
        <option value="0">Tanpa Batas</option>
      </select>
    </div>
    <div class="player-list" id="playerList"></div>
    <button id="readyBtn" class="btn-ready">I AM READY</button>
    <button id="startBtn" class="hidden">MULAI GAME (Khusus Host)</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="game-header">
      <span id="turnIndicator">Menunggu...</span>
      <span id="timerIndicator" class="timer">⏳ 10s</span>
    </div>
    <div id="board" class="board"></div>
    <button id="backToLobbyBtn" class="hidden" style="margin-top: 15px;">Kembali ke Lobby (Host)</button>
  </div>
</div>

<script>
  const socket = io();
  let myId = null;
  let isHost = false;

  // Elemen DOM
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const setupScreen = document.getElementById('setupScreen');
  const lobbyScreen = document.getElementById('lobbyScreen');
  const gameScreen = document.getElementById('gameScreen');
  const playerList = document.getElementById('playerList');
  const hostSettings = document.getElementById('hostSettings');
  const timerSelect = document.getElementById('timerSelect');
  const readyBtn = document.getElementById('readyBtn');
  const startBtn = document.getElementById('startBtn');
  const boardEl = document.getElementById('board');
  const turnIndicator = document.getElementById('turnIndicator');
  const timerIndicator = document.getElementById('timerIndicator');
  const backToLobbyBtn = document.getElementById('backToLobbyBtn');

  // Akses Kamera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { alert("Kamera diperlukan untuk bermain game ini!"); });

  // Jepret Wajah (Auto-Crop Lingkaran ke PNG Transparan)
  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) return alert("Isi nama dulu!");

    // Menghitung area crop tengah
    const size = Math.min(video.videoWidth, video.videoHeight);
    const sx = (video.videoWidth - size) / 2;
    const sy = (video.videoHeight - size) / 2;

    // Gambar frame video ke canvas dan jadikan bentuk lingkaran (masking)
    ctx.clearRect(0, 0, 200, 200);
    
    // Perbaikan efek cermin pada gambar yang di-crop
    ctx.translate(200, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, size, size, 0, 0, 200, 200);
    
    // Kembalikan transformasi agar tidak merusak operasi selanjutnya
    ctx.setTransform(1, 0, 0, 1, 0, 0); 
    
    ctx.globalCompositeOperation = 'destination-in';
    ctx.beginPath();
    ctx.arc(100, 100, 100, 0, Math.PI * 2);
    ctx.fill();

    const photoBase64 = canvas.toDataURL('image/png');
    
    socket.emit('joinRoom', { name, photo: photoBase64 });
    video.srcObject.getTracks().forEach(track => track.stop()); // Matikan kamera
  });

  socket.on('joinSuccess', (data) => {
    myId = data.id;
    isHost = data.isHost;
    setupScreen.classList.add('hidden');
    lobbyScreen.classList.remove('hidden');
    if (isHost) hostSettings.classList.remove('hidden');
  });

  socket.on('lobbyUpdate', (data) => {
    playerList.innerHTML = '';
    let allReady = true;

    data.players.forEach(p => {
      if (!p.isReady) allReady = false;
      const meStr = p.id === myId ? '(You)' : '';
      const hostStr = p.isHost ? '👑' : '';
      playerList.innerHTML += `
        <div class="player-item">
          <img src="${p.photo}">
          <span style="font-size:12px; font-weight:bold;">${p.name} ${hostStr}</span>
          <span class="status-tag ${p.isReady ? 'ready' : ''}">${p.isReady ? 'READY' : 'WAIT'}</span>
        </div>`;
    });

    if (isHost && data.players.length >= 2) {
      startBtn.classList.remove('hidden');
      startBtn.disabled = !allReady;
    } else {
      startBtn.classList.add('hidden');
    }

    if (!isHost) timerSelect.value = data.timerLimit;
  });

  timerSelect.addEventListener('change', () => { socket.emit('changeTimer', timerSelect.value); });
  readyBtn.addEventListener('click', () => { socket.emit('toggleReady'); });
  startBtn.addEventListener('click', () => { socket.emit('startGame'); });

  // Game Logic
  let currentPlayers = [];
  socket.on('gameStarted', (settings) => {
    lobbyScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    document.getElementById('sysMsg').innerText = `Sambungkan ${settings.winStreak} wajahmu untuk menang!`;
    boardEl.style.gridTemplateColumns = `repeat(${settings.size}, 1fr)`;
    backToLobbyBtn.classList.add('hidden');
  });

  socket.on('gameUpdate', (state) => {
    currentPlayers = state.players;
    const activePlayer = state.players[state.turnIndex];
    
    if (activePlayer.id === myId) {
      turnIndicator.innerHTML = `Giliranmu!`;
      turnIndicator.style.color = '#22c55e';
    } else {
      turnIndicator.innerHTML = `Giliran: <img src="${activePlayer.photo}" style="width:20px; border-radius:50%; vertical-align:middle;"> ${activePlayer.name}`;
      turnIndicator.style.color = '#f8fafc';
    }

    boardEl.innerHTML = '';
    state.board.forEach((cellVal, idx) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (cellVal !== null) {
        const img = document.createElement('img');
        img.src = state.players[cellVal].photo;
        cell.appendChild(img);
      } else {
        cell.addEventListener('click', () => socket.emit('makeMove', idx));
      }
      boardEl.appendChild(cell);
    });
  });

  socket.on('timerTick', (time) => {
    timerIndicator.innerText = time > 0 ? `⏳ ${time}s` : '⏳ -';
  });

  socket.on('gameOver', (data) => {
    if (data.winner) turnIndicator.innerHTML = `🏆 ${data.winner.name} MENANG!`;
    else turnIndicator.innerHTML = `⚖️ SERI! Papan Penuh.`;
    
    if (isHost) backToLobbyBtn.classList.remove('hidden');
  });

  backToLobbyBtn.addEventListener('click', () => { socket.emit('backToLobby'); });
  
  socket.on('returnToLobby', () => {
    gameScreen.classList.add('hidden');
    lobbyScreen.classList.remove('hidden');
    document.getElementById('sysMsg').innerText = "Jadikan wajahmu sebagai bidak catur!";
  });

  socket.on('errorMsg', (msg) => alert(msg));
</script>
</body>
</html>
