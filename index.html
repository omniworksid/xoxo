<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ches. - lesser than chess</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #d4af37;
      --light-sq: #f0d9b5;
      --dark-sq: #b58863;
      --highlight: rgba(255, 255, 0, 0.5);
      --text: #e0e0e0;
      --danger: #ff4d4d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

    .app-container {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    /* Modal Input Nama */
    .modal {
      position: absolute; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.92);
      border-radius: 16px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 25px; z-index: 100;
    }
    .modal h2 { font-size: 28px; color: var(--accent); margin-bottom: 5px; }
    .modal p { font-size: 13px; color: #aaa; margin-bottom: 20px; text-align: center; }
    .modal input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444;
      background: #111; color: #fff; font-size: 16px; margin-bottom: 15px; text-align: center;
    }
    .modal button {
      width: 100%; padding: 12px; background: var(--accent); color: #000;
      font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
    }

    /* Header & Titles */
    .header { text-align: center; margin-bottom: 15px; }
    .title { font-size: 32px; font-weight: 900; letter-spacing: 1px; }
    .subtitle { font-size: 12px; color: #888; font-style: italic; margin-top: -4px; }

    /* Lobby status */
    .players-list { display: flex; justify-content: space-between; margin-bottom: 15px; background: #151518; padding: 10px; border-radius: 10px; }
    .player-card { font-size: 13px; font-weight: bold; }
    .status-ready { color: #4caf50; font-size: 11px; }
    .status-notready { color: #ff9800; font-size: 11px; }

    /* Ready Button */
    .ready-btn {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none;
      border-radius: 8px; background: #444; color: #888; cursor: not-allowed; transition: 0.2s;
      margin-bottom: 15px;
    }
    .ready-btn.active { background: #4caf50; color: #fff; cursor: pointer; }

    /* Game Info Bar */
    .game-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .timer-badge { background: var(--danger); color: #fff; padding: 4px 10px; border-radius: 12px; font-weight: bold; }

    /* 4x4 Chess Board */
    .board-4x4 {
      display: grid; grid-template-columns: repeat(4, 1fr);
      width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      border: 3px solid #333; margin-bottom: 15px;
    }
    .square {
      display: flex; justify-content: center; align-items: center;
      font-size: 42px; cursor: pointer; user-select: none; position: relative;
    }
    .square.light { background: var(--light-sq); }
    .square.dark { background: var(--dark-sq); }
    .square.selected { background: var(--highlight) !important; }

    /* Quick Emojis */
    .emoji-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .emoji-btn {
      background: #2a2a32; border: none; font-size: 22px; padding: 8px;
      border-radius: 8px; cursor: pointer; transition: 0.1s; flex: 1; margin: 0 2px;
    }
    .emoji-btn:hover { background: #3a3a45; transform: scale(1.1); }

    /* Chat Area */
    .chat-box { background: #151518; height: 80px; border-radius: 8px; overflow-y: auto; padding: 8px; font-size: 12px; margin-bottom: 8px; }
    .chat-msg { margin-bottom: 4px; word-break: break-word; }
    .chat-input-group { display: flex; gap: 5px; }
    .chat-input-group input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; }
    .chat-input-group button { background: #444; color: #fff; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer; }

    /* Result Overlay */
    .result-screen {
      position: absolute; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.92); border-radius: 16px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; text-align: center; z-index: 90;
    }
    .result-title { font-size: 22px; color: var(--accent); margin-bottom: 15px; }
    .btn-warrior { width: 100%; padding: 12px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
    .btn-loser { width: 100%; padding: 12px; background: #e53935; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- MODAL NAME INPUT -->
  <div id="nameModal" class="modal">
    <h2>Ches.</h2>
    <p>lesser than chess (4x4 Fast Chess)</p>
    <input type="text" id="usernameInput" placeholder="Masukkan Nama Kamu..." maxlength="12">
    <button id="joinBtn">MASUK ROOM</button>
  </div>

  <!-- RESULT MODAL -->
  <div id="resultScreen" class="result-screen hidden">
    <div id="resultReason" class="result-title"></div>
    <button id="rematchBtn" class="btn-warrior">Rematch like a Warrior ⚔️</button>
    <button id="exitBtn" class="btn-loser">Exit like a loser - boo 👻</button>
  </div>

  <!-- HEADER -->
  <div class="header">
    <div class="title">Ches.</div>
    <div class="subtitle">lesser than chess</div>
  </div>

  <!-- PLAYERS / LOBBY STATUS -->
  <div class="players-list">
    <div id="p1Card" class="player-card">P1: Waiting...</div>
    <div id="p2Card" class="player-card">P2: Waiting...</div>
  </div>

  <button id="readyBtn" class="ready-btn">I AM READY</button>

  <!-- GAME INTERFACE -->
  <div id="gameSection">
    <div class="game-bar">
      <span id="turnInfo">Giliran: -</span>
      <span id="roundInfo">Ronde: 1/5</span>
      <span id="timerInfo" class="timer-badge">⏳ 5s</span>
    </div>

    <div id="board" class="board-4x4"></div>

    <!-- QUICK EMOJIS (5 Respect / Disrespect) -->
    <div class="emoji-bar">
      <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
      <button class="emoji-btn" onclick="sendEmoji('🧠')">🧠</button>
      <button class="emoji-btn" onclick="sendEmoji('🤡')">🤡</button>
      <button class="emoji-btn" onclick="sendEmoji('💤')">💤</button>
      <button class="emoji-btn" onclick="sendEmoji('💀')">💀</button>
    </div>

    <!-- CHAT -->
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-group">
      <input type="text" id="chatInput" placeholder="Ketik pesan..." maxlength="50">
      <button id="sendChatBtn">Kirim</button>
    </div>
  </div>
</div>

<script>
  const socket = io();
  const pieceSymbols = {
    'wK': '♔', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
    'bK': '♚', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
  };

  let myRole = null;
  let selectedSquare = null;
  let currentBoard = Array(16).fill(null);

  // DOM Elements
  const nameModal = document.getElementById('nameModal');
  const usernameInput = document.getElementById('usernameInput');
  const joinBtn = document.getElementById('joinBtn');
  const readyBtn = document.getElementById('readyBtn');
  const p1Card = document.getElementById('p1Card');
  const p2Card = document.getElementById('p2Card');
  const turnInfo = document.getElementById('turnInfo');
  const roundInfo = document.getElementById('roundInfo');
  const timerInfo = document.getElementById('timerInfo');
  const boardEl = document.getElementById('board');
  const resultScreen = document.getElementById('resultScreen');
  const resultReason = document.getElementById('resultReason');
  const rematchBtn = document.getElementById('rematchBtn');
  const exitBtn = document.getElementById('exitBtn');
  const chatBox = document.getElementById('chatBox');
  const chatInput = document.getElementById('chatInput');
  const sendChatBtn = document.getElementById('sendChatBtn');

  // Join Room
  joinBtn.addEventListener('click', () => {
    const val = usernameInput.value.trim();
    if (val) {
      socket.emit('joinRoom', val);
      nameModal.classList.add('hidden');
    }
  });

  socket.on('assignedRole', (data) => {
    myRole = data.role;
  });

  // Ready Button
  readyBtn.addEventListener('click', () => {
    socket.emit('toggleReady');
  });

  // Render 4x4 Board
  function renderBoard(board) {
    boardEl.innerHTML = '';
    currentBoard = board;

    for (let i = 0; i < 16; i++) {
      const row = Math.floor(i / 4);
      const col = i % 4;
      const isDark = (row + col) % 2 === 1;

      const sq = document.createElement('div');
      sq.className = `square ${isDark ? 'dark' : 'light'}`;
      if (selectedSquare === i) sq.classList.add('selected');

      const piece = board[i];
      if (piece) {
        sq.innerText = pieceSymbols[piece] || '';
        sq.style.color = piece[0] === 'w' ? '#ffffff' : '#000000';
      }

      sq.addEventListener('click', () => handleSquareClick(i));
      boardEl.appendChild(sq);
    }
  }

  function handleSquareClick(index) {
    if (selectedSquare === null) {
      if (currentBoard[index]) selectedSquare = index;
    } else {
      socket.emit('makeMove', { from: selectedSquare, to: index });
      selectedSquare = null;
    }
    renderBoard(currentBoard);
  }

  // Update Game State
  socket.on('updateGame', (state) => {
    // Update Player Cards
    const p1 = state.players[0];
    const p2 = state.players[1];

    p1Card.innerHTML = p1 
      ? `${p1.name} (${p1.color ? (p1.color==='w'?'Putih':'Hitam') : 'P1'}) [${p1.score}]<br><span class="${p1.ready?'status-ready':'status-notready'}">${p1.ready?'READY':'WAITING'}</span>`
      : "P1: Waiting...";

    p2Card.innerHTML = p2 
      ? `${p2.name} (${p2.color ? (p2.color==='w'?'Putih':'Hitam') : 'P2'}) [${p2.score}]<br><span class="${p2.ready?'status-ready':'status-notready'}">${p2.ready?'READY':'WAITING'}</span>`
      : "P2: Waiting...";

    // Enable Ready Button jika pemain lengkap
    if (state.players.length === 2 && (myRole === 'P1' || myRole === 'P2')) {
      readyBtn.classList.add('active');
    } else {
      readyBtn.classList.remove('active');
    }

    roundInfo.innerText = `Ronde: ${state.round}/5`;
    turnInfo.innerText = `Giliran: ${state.turn === 'w' ? 'Putih ♔' : 'Hitam ♚'}`;

    renderBoard(state.board);
  });

  socket.on('timerUpdate', (time) => {
    timerInfo.innerText = `⏳ ${time}s`;
  });

  socket.on('roundOver', (data) => {
    resultReason.innerText = data.reason;
    resultScreen.classList.remove('hidden');
  });

  rematchBtn.addEventListener('click', () => {
    socket.emit('voteRematch');
    rematchBtn.innerText = "Menunggu Lawan Rematch...";
  });

  exitBtn.addEventListener('click', () => {
    socket.emit('exitGame');
    location.reload();
  });

  socket.on('gameReset', () => {
    location.reload();
  });

  // Chat & Emojis
  function sendEmoji(emoji) {
    socket.emit('sendEmoji', emoji);
  }

  sendChatBtn.addEventListener('click', () => {
    const txt = chatInput.value.trim();
    if (txt) {
      socket.emit('sendChat', txt);
      chatInput.value = '';
    }
  });

  socket.on('newChat', (data) => {
    const el = document.createElement('div');
    el.className = 'chat-msg';
    el.innerHTML = `<strong>${data.sender}:</strong> ${data.text}`;
    chatBox.appendChild(el);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  socket.on('newEmoji', (data) => {
    const el = document.createElement('div');
    el.className = 'chat-msg';
    el.innerHTML = `<strong>${data.sender}:</strong> <span style="font-size:18px">${data.emoji}</span>`;
    chatBox.appendChild(el);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  // Initial Render Board Kosong
  renderBoard(Array(16).fill(null));
</script>
</body>
</html>
